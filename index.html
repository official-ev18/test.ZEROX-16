<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Zerox Game Studios</title>
  <meta name="description" content="The Zerox Game Studios is an independent game development studio building dark, atmospheric and experimental games.">
  <link rel="icon" href="https://cdn.imgurl.ir/uploads/b18142_Negar_1789379626960.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root {
      --ink: #08090a;
      --slate-900: #111316;
      --slate-800: #1a1d21;
      --slate-700: #25292e;
      --slate-500: #5b636c;
      --slate-400: #7c848d;
      --slate-300: #a7aeb6;
      --white: #f4f4f2;
      --line: rgba(255,255,255,.08);
      --font-display: 'Bebas Neue', 'Oswald', sans-serif;
      --font-ui: 'Oswald', 'Bebas Neue', sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --ease: cubic-bezier(.2,.7,.1,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--slate-900);
      color: var(--white);
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    ::selection { background: var(--white); color: var(--ink); }

    body::after {
      content: "";
      position: fixed;
      inset: -50%;
      pointer-events: none;
      z-index: 999;
      opacity: .05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain 1s steps(6) infinite;
    }

    /* ---------- NAV ---------- */
    nav {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 5vw;
      transition: padding .4s var(--ease), background .4s, border-color .4s;
      border-bottom: 1px solid transparent;
    }

    nav.scrolled {
      padding: 14px 5vw;
      background: rgba(8,9,10,.82);
      backdrop-filter: blur(10px);
      border-bottom-color: var(--line);
    }

    .nav-logo img { height: 40px; width: auto; filter: invert(1); }

    .nav-links { display: flex; gap: 38px; list-style: none; align-items: center; }

    .nav-links a {
      font-family: var(--font-ui);
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--slate-300);
      position: relative;
      transition: color .3s;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0; bottom: -6px;
      width: 0; height: 1px;
      background: var(--white);
      transition: width .4s var(--ease);
    }

    .nav-links a:hover { color: var(--white); }
    .nav-links a:hover::after { width: 100%; }

    .nav-cta {
      border: 1px solid var(--white);
      padding: 10px 22px;
      color: var(--white) !important;
    }
    .nav-cta::after { display: none; }
    .nav-cta:hover { background: var(--white); color: var(--ink) !important; }

    .menu-toggle {
      display: none;
      background: none;
      border: 0;
      color: var(--white);
      font-family: var(--font-ui);
      font-size: 1rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* ---------- HERO ---------- */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 620px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: var(--ink);
    }

    .hero-bg {
      position: absolute;
      inset: -4%;
      background: url('https://cdn.imgurl.ir/uploads/x571205_Negar_1788480643884.png') center / cover no-repeat;
      animation: slowZoom 22s ease-in-out infinite alternate;
      will-change: transform;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to top, var(--slate-900) 0%, rgba(17,19,22,.5) 35%, rgba(8,9,10,.15) 70%),
        linear-gradient(to right, rgba(8,9,10,.6), transparent 60%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 0 5vw 12vh;
      max-width: 1100px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-ui);
      font-size: .85rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--slate-300);
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 1s var(--ease) .3s forwards;
    }

    .hero-kicker::before {
      content: "";
      width: 46px;
      height: 1px;
      background: var(--slate-300);
    }

    .hero h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(4.2rem, 13vw, 11rem);
      line-height: .86;
      letter-spacing: .01em;
      text-transform: uppercase;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeUp 1.1s var(--ease) .5s forwards;
    }

    .hero h1 span { display: block; }
    .hero h1 .outline {
      color: transparent;
      -webkit-text-stroke: 1px var(--white);
    }

    .hero-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 40px;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 1.1s var(--ease) .8s forwards;
    }

    .hero p {
      color: #c9ced4;
      font-size: 1.05rem;
      max-width: 460px;
      font-weight: 300;
    }

    .btn-row { display: flex; gap: 14px; flex-wrap: wrap; }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-ui);
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 16px 34px;
      border: 1px solid var(--white);
      overflow: hidden;
      transition: color .4s var(--ease);
      cursor: pointer;
      isolation: isolate;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--white);
      transform: translateX(-101%);
      transition: transform .5s var(--ease);
      z-index: -1;
    }

    .btn:hover::before { transform: translateX(0); }
    .btn:hover { color: var(--ink); }

    .btn-solid { background: var(--white); color: var(--ink); }
    .btn-solid::before { background: var(--ink); }
    .btn-solid:hover { color: var(--white); }

    .btn .arrow { transition: transform .4s var(--ease); }
    .btn:hover .arrow { transform: translateX(6px); }

    .scroll-hint {
      position: absolute;
      right: 5vw;
      bottom: 46px;
      z-index: 2;
      writing-mode: vertical-rl;
      font-family: var(--font-ui);
      font-size: .72rem;
      letter-spacing: .4em;
      color: var(--slate-400);
      text-transform: uppercase;
    }

    .scroll-hint::after {
      content: "";
      display: block;
      width: 1px;
      height: 60px;
      margin: 16px auto 0;
      background: linear-gradient(to bottom, var(--white), transparent);
      animation: drip 2s var(--ease) infinite;
    }

    /* ---------- TICKER ---------- */
    .ticker {
      border-block: 1px solid var(--line);
      background: var(--ink);
      overflow: hidden;
      white-space: nowrap;
      padding: 20px 0;
    }

    .ticker-track {
      display: inline-flex;
      animation: marquee 32s linear infinite;
    }

    .ticker-track span {
      font-family: var(--font-display);
      font-size: 2.4rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--slate-400);
      padding: 0 34px;
    }

    .ticker-track span.dot { color: var(--white); padding: 0 6px; }

    /* ---------- SECTIONS ---------- */
    section { position: relative; padding: 150px 5vw; }

    .eyebrow {
      display: block;
      font-family: var(--font-ui);
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--slate-400);
      margin-bottom: 18px;
    }

    .title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: .92;
      letter-spacing: .01em;
      text-transform: uppercase;
    }

    /* ---------- MANIFESTO ---------- */
    .manifesto {
      background: var(--ink);
      padding-top: 180px;
      padding-bottom: 180px;
    }

    .manifesto-text {
      max-width: 1180px;
      font-family: var(--font-ui);
      font-weight: 400;
      font-size: clamp(1.9rem, 4.2vw, 3.6rem);
      line-height: 1.22;
      text-transform: uppercase;
      letter-spacing: .01em;
    }

    .manifesto-text .muted { color: var(--slate-500); }

    /* ---------- FEATURED (SilentGears) ---------- */
    .featured { background: var(--slate-900); padding-top: 0; }

    .featured-card {
      position: relative;
      min-height: 80vh;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .featured-art {
      position: absolute;
      inset: 0;
      background: url('https://cdn.imgurl.ir/uploads/k51183_Negar_1788164380627.jpg') center / cover no-repeat;
      filter: contrast(1.1) brightness(.6);
      transition: transform 1.4s var(--ease), filter 1.4s var(--ease);
    }

    .featured-card:hover .featured-art {
      transform: scale(1.04);
      filter: contrast(1.05) brightness(.75);
    }

    .featured-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8,9,10,.95) 10%, rgba(8,9,10,.2) 70%);
    }

    .featured-body {
      position: relative;
      z-index: 2;
      padding: 56px;
      max-width: 720px;
    }

    .tag {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      padding: 7px 14px;
      background: var(--white);
      color: var(--ink);
      margin-bottom: 22px;
    }

    .featured-body h3 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(3.4rem, 8vw, 7rem);
      line-height: .88;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .featured-body p {
      color: #c9ced4;
      font-size: 1.05rem;
      max-width: 540px;
      margin-bottom: 32px;
    }

    .meta {
      font-family: var(--font-ui);
      font-size: .78rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--slate-400);
      margin-top: 22px;
    }

    /* ---------- GAMES GRID ---------- */
    .games { background: var(--slate-900); }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      flex-wrap: wrap;
      margin-bottom: 70px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 22px;
    }

    .game-card {
      position: relative;
      background: var(--slate-800);
      overflow: hidden;
      aspect-ratio: 4 / 5;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
      border: 1px solid var(--line);
      transition: border-color .4s;
    }

    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 1px, transparent 1px 16px),
        linear-gradient(170deg, var(--slate-700), var(--ink));
      transition: transform 1s var(--ease);
    }

    .game-card.has-cover::before {
      background: url('https://cdn.imgurl.ir/uploads/k51183_Negar_1788164380627.jpg') center / cover no-repeat;
      filter: brightness(.55);
    }

    .game-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8,9,10,.95) 15%, rgba(8,9,10,0) 60%);
      z-index: 1;
    }

    .game-card:hover::before { transform: scale(1.06); }
    .game-card:hover { border-color: rgba(255,255,255,.25); }

    .game-number {
      position: absolute;
      top: 24px;
      left: 28px;
      font-family: var(--font-display);
      font-size: 5rem;
      line-height: 1;
      color: rgba(255,255,255,.12);
      z-index: 2;
    }

    .game-status {
      position: absolute;
      top: 28px;
      right: 28px;
      z-index: 2;
      font-family: var(--font-ui);
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.4);
      color: var(--white);
      background: rgba(8,9,10,.5);
    }

    .game-body { position: relative; z-index: 2; }

    .game-body h4 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 2.6rem;
      line-height: .95;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .game-body p { color: var(--slate-300); font-size: .95rem; margin-bottom: 16px; }

    .game-body .platforms {
      font-family: var(--font-ui);
      font-size: .74rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--slate-400);
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    /* ---------- SCREENSHOTS ---------- */
    .shots {
      background: var(--ink);
      border-top: 1px solid var(--line);
    }

    .shots-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 18px;
    }

    .shot {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
    }

    .shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s var(--ease), filter .6s;
      filter: grayscale(.25) contrast(1.05);
    }

    .shot:hover img { transform: scale(1.05); filter: grayscale(0) contrast(1.05); }

    .shot-caption {
      position: absolute;
      left: 20px;
      bottom: 18px;
      font-family: var(--font-ui);
      font-size: .75rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      background: rgba(8,9,10,.7);
      padding: 6px 12px;
    }

    /* ---------- STUDIO ---------- */
    .studio {
      background: var(--slate-900);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .studio-text p {
      color: var(--slate-300);
      font-size: 1.05rem;
      margin-top: 26px;
      max-width: 520px;
    }

    .pillars { display: grid; border-top: 1px solid var(--line); }

    .pillar {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 20px;
      padding: 36px 0;
      border-bottom: 1px solid var(--line);
      transition: padding .4s var(--ease);
    }

    .pillar:hover { padding-left: 16px; }

    .pillar .n {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--slate-400);
      letter-spacing: .1em;
    }

    .pillar h5 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 2.2rem;
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .pillar p { color: var(--slate-300); font-size: .95rem; }

    /* ---------- CREATOR ---------- */
    .creator {
      background: var(--ink);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 70px;
      align-items: center;
    }

    .creator-photo {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .creator-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1) contrast(1.1);
      transition: filter .8s var(--ease), transform 1.2s var(--ease);
    }

    .creator-photo:hover img { filter: grayscale(0); transform: scale(1.03); }

    .creator-text p {
      color: var(--slate-300);
      font-size: 1.05rem;
      margin-top: 24px;
      max-width: 560px;
    }

    .creator-text .name {
      font-family: var(--font-ui);
      font-size: .95rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--white);
      margin-top: 20px;
    }

    .creator-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .creator-links a {
      font-family: var(--font-ui);
      font-size: .85rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 12px 22px;
      border: 1px solid var(--slate-500);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all .4s var(--ease);
    }

    .creator-links a:hover { border-color: var(--white); background: var(--white); color: var(--ink); }

    /* ---------- CONTACT ---------- */
    .contact {
      background: var(--slate-900);
      text-align: center;
      padding-top: 180px;
      padding-bottom: 180px;
      border-top: 1px solid var(--line);
    }

    .contact .title { margin-bottom: 26px; }

    .contact p.lead {
      color: var(--slate-300);
      max-width: 560px;
      margin: 0 auto 50px;
      font-size: 1.05rem;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .socials a {
      font-family: var(--font-ui);
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 16px 30px;
      border: 1px solid var(--slate-500);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all .4s var(--ease);
    }

    .socials a:hover {
      border-color: var(--white);
      background: var(--white);
      color: var(--ink);
    }

    /* ---------- FOOTER ---------- */
    footer {
      background: var(--ink);
      border-top: 1px solid var(--line);
      padding: 56px 5vw;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    footer .brand img { height: 38px; width: auto; filter: invert(1); opacity: .85; }

    footer .foot-social { display: flex; gap: 18px; }

    footer .foot-social a {
      font-size: 1.2rem;
      color: var(--slate-300);
      transition: color .3s, transform .3s var(--ease);
    }

    footer .foot-social a:hover { color: var(--white); transform: translateY(-3px); }

    footer .legal {
      color: var(--slate-400);
      font-size: .82rem;
    }

    /* ---------- REVEAL ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1.1s var(--ease), transform 1.1s var(--ease);
    }
    .reveal.visible { opacity: 1; transform: none; }

    .reveal-delay-1 { transition-delay: .12s; }
    .reveal-delay-2 { transition-delay: .24s; }

    /* ---------- KEYFRAMES ---------- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slowZoom {
      from { transform: scale(1); }
      to   { transform: scale(1.08); }
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    @keyframes drip {
      0%   { transform: scaleY(0); transform-origin: top; }
      50%  { transform: scaleY(1); transform-origin: top; }
      51%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    @keyframes grain {
      0%, 100% { transform: translate(0,0); }
      20%  { transform: translate(-3%, 2%); }
      40%  { transform: translate(2%, -4%); }
      60%  { transform: translate(-4%, 3%); }
      80%  { transform: translate(3%, -2%); }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 960px) {
      .studio, .creator { grid-template-columns: 1fr; gap: 60px; }
      .creator-photo { max-width: 380px; }
      .shots-grid { grid-template-columns: 1fr; }
      .nav-links {
        position: fixed;
        inset: 0;
        background: var(--ink);
        flex-direction: column;
        justify-content: center;
        gap: 34px;
        display: none;
      }
      .nav-links.open { display: flex; }
      .menu-toggle { display: block; }
      .featured-body { padding: 36px; }
    }

    @media (max-width: 600px) {
      section { padding: 110px 5vw; }
      .scroll-hint { display: none; }
      .ticker-track span { font-size: 1.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .reveal, .hero-kicker, .hero h1, .hero-bottom { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
