:root {
  --pista: #A9C97A;
  --pista-l: #E4EFCB;
  --pista-d: #5C7F35;
  --pista-dd: #2D4A1B;
  --cream: #FAF7EA;
  --gold: #B8913A;
  --gold-l: #E3C679;
  --rose: #A8334F;
  --rose-l: #F2C9D1;
  --ink: #26351A;
  --line: 1.5px solid var(--gold);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; font-family: "Meem", Tahoma, sans-serif; font-weight: 600;
  color: var(--ink); background: var(--cream); line-height: 1.95; font-size: 16px; overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button { font: inherit; cursor: pointer; }
.wrap { width: min(1080px, calc(100% - 36px)); margin-inline: auto; position: relative; z-index: 2; }

/* khatam (8-point star) pattern used as a texture */
.khatam {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><g fill='none' stroke='%23B8913A' stroke-opacity='.35' stroke-width='1'><path d='M30 4 L38 22 L56 30 L38 38 L30 56 L22 38 L4 30 L22 22 Z'/><path d='M30 14 L34 26 L46 30 L34 34 L30 46 L26 34 L14 30 L26 26 Z' stroke-opacity='.25'/></g></svg>");
  background-size: 60px 60px;
}

/* panels: each section is its own full page */
.panel { position: relative; min-height: 100vh; padding: 110px 0 90px; overflow: hidden; display: flex; align-items: center; }
.panel-hero { background: var(--pista); padding: 0; }
.p-cream { background: var(--cream); }
.p-light { background: var(--pista-l); }
.p-rose { background: #7A2A3E; color: #FBEFF2; }
.p-deep { background: var(--pista-dd); color: #F3F7E8; }
.p-deep .head h2, .p-rose .head h2 { color: var(--gold-l); }

/* double border frame */
.frame { position: relative; border: var(--line); padding: 8px; }
.frame::before { content: ""; position: absolute; inset: 4px; border: 1px solid var(--gold); pointer-events: none; }

/* header bar */
.top {
  position: fixed; top: 0; inset-inline: 0; z-index: 60; background: rgba(250,247,234,.92);
  backdrop-filter: blur(8px); border-bottom: var(--line);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; flex-wrap: wrap; }
.logo { text-decoration: none; font-size: 26px; color: var(--pista-dd); }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav a { text-decoration: none; font-size: 14px; padding: 4px 12px; color: var(--pista-dd); border: 1px solid transparent; }
.nav a:hover, .nav a.on { color: var(--rose); border-color: var(--gold); }
.nav a.hot { color: var(--rose); }

/* section heading: kitabe ribbon */
.head { text-align: center; margin-bottom: 40px; }
.head .no {
  display: inline-grid; place-items: center; width: 54px; height: 54px; border-radius: 50%;
  background: var(--rose); color: #fff; border: 2px solid var(--gold); font-size: 18px; margin-bottom: 12px;
  box-shadow: 0 0 0 4px var(--cream), 0 0 0 5.5px var(--gold);
}
.head h2 {
  display: inline-block; margin: 0; font-size: clamp(32px, 5vw, 52px); line-height: 1.5;
  color: var(--pista-dd); padding: 4px 46px; position: relative;
}
.head h2::before, .head h2::after {
  content: "❖"; position: absolute; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 20px;
}
.head h2::before { right: 0; }
.head h2::after { left: 0; }
.head p { margin: 10px 0 0; opacity: .8; font-size: 15px; }

/* HERO */
.hero { min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; background: var(--pista); }
.arch {
  position: relative; width: min(560px, 92vw); padding: 56px 30px 46px;
  background: var(--cream); border-radius: 280px 280px 18px 18px;
  border: 3px solid var(--gold); box-shadow: 0 0 0 10px var(--pista), 0 0 0 12px var(--gold), 0 30px 60px -20px rgba(45,74,27,.5);
}
.arch::before {
  content: ""; position: absolute; inset: 12px; border: 1px solid var(--gold);
  border-radius: 270px 270px 10px 10px; pointer-events: none;
}
.arch .mini { font-size: 16px; color: var(--rose); }
.hero h1 { margin: 10px 0 6px; font-size: clamp(50px, 10vw, 96px); line-height: 1.3; color: var(--pista-dd); }
.hero .sub { font-size: 18px; margin: 0 0 22px; }
.hero .rule { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--gold); margin: 14px 0 26px; }
.hero .rule::before, .hero .rule::after { content: ""; width: 70px; height: 1px; background: var(--gold); }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn {
  text-decoration: none; padding: 10px 26px; border: 1.5px solid var(--gold); color: var(--pista-dd);
  background: var(--cream); transition: .2s; border-radius: 999px;
}
.btn:hover { background: var(--pista-dd); color: var(--gold-l); }
.btn.rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.btn.rose:hover { background: #7A2A3E; }
.scroll-hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); color: var(--pista-dd); font-size: 14px; }

/* chips as small arches */
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 36px; }
.chip {
  border: 1.5px solid var(--gold); background: transparent; padding: 6px 18px;
  border-radius: 999px 999px 8px 8px; font-size: 14px; color: var(--pista-dd);
}
.chip.on { background: var(--pista-dd); color: var(--gold-l); border-color: var(--pista-dd); }

/* cards with arched frames */
.grid { display: grid; gap: 34px 28px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); justify-items: center; }
.card { width: 100%; max-width: 340px; text-align: center; }
.cover {
  position: relative; width: 100%; aspect-ratio: 4/5; border-radius: 170px 170px 14px 14px;
  overflow: hidden; border: 2px solid var(--gold); box-shadow: 0 0 0 6px var(--cream), 0 0 0 7.5px var(--gold);
  margin-bottom: 22px; background: var(--pista-l);
}
.cover img { width: 100%; height: 100%; object-fit: cover; }
.card h3 { margin: 0 0 10px; font-size: 26px; color: var(--pista-dd); }
.tags { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.tag { font-size: 13px; padding: 2px 12px; border-radius: 999px; background: var(--rose); color: #fff; }
.cat { font-size: 13px; padding: 2px 12px; border-radius: 999px; border: 1px solid var(--gold); color: var(--pista-dd); }
audio { width: 100%; height: 40px; margin-bottom: 12px; }
.credits { list-style: none; margin: 0 0 10px; padding: 0; font-size: 14px; }
.credits li { padding: 3px 0; border-bottom: 1px dashed rgba(184,145,58,.5); }
.credits b { color: var(--rose); margin-inline-end: 4px; font-weight: 600; }
.note { font-size: 13px; margin: 0; padding: 8px 12px; border: 1px solid var(--gold); border-radius: 10px; }

/* popular on deep bg */
.p-deep .card h3 { color: var(--gold-l); }
.p-deep .credits li { border-color: rgba(227,198,121,.3); }
.p-deep .credits b { color: var(--gold-l); }
.p-deep .note { border-color: var(--gold-l); color: #F3F7E8; }
.p-deep .cat { color: var(--gold-l); border-color: var(--gold-l); }
.p-deep .cover { box-shadow: 0 0 0 6px var(--pista-dd), 0 0 0 7.5px var(--gold-l); }

/* video */
.vid-wrap { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; max-width: 1000px; margin-inline: auto; }
.vid-frame { border-radius: 24px; overflow: hidden; border: 2px solid var(--gold-l); box-shadow: 0 0 0 8px rgba(227,198,121,.15); }
.vid-frame video { width: 100%; display: block; background: #000; }
.vid-info h3 { font-size: 30px; margin: 0 0 14px; color: var(--gold-l); }
.vid-info .credits li { border-color: rgba(227,198,121,.3); }
.vid-info .credits b { color: var(--gold-l); }
@media (max-width: 800px) { .vid-wrap { grid-template-columns: 1fr; } }

/* gallery mosaic */
.mosaic { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
.shot {
  border: 2px solid var(--gold); padding: 0; cursor: zoom-in; border-radius: 999px 999px 12px 12px;
